<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Pronunciation Test - SafeDrive</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .test-case {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
        }
        .test-input {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .test-expected {
            color: #10b981;
            font-size: 14px;
        }
        .test-result {
            color: #ef4444;
            font-size: 14px;
            margin-top: 5px;
        }
        .test-result.success {
            color: #10b981;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .stats {
            margin-top: 30px;
            padding: 20px;
            background: #e0f2fe;
            border-radius: 8px;
        }
        .stats h3 {
            margin-top: 0;
            color: #0369a1;
        }
        .console-output {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .console-output div {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎤 Voice Pronunciation Test</h1>
        <p class="subtitle">Test the pronunciation mapping for Korean plate numbers</p>
        
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearConsole()">Clear Console</button>
        
        <div id="testCases"></div>
        
        <div class="stats" id="stats" style="display:none;">
            <h3>Test Results</h3>
            <p><strong>Total:</strong> <span id="totalTests">0</span></p>
            <p><strong>Passed:</strong> <span id="passedTests" style="color:#10b981;">0</span></p>
            <p><strong>Failed:</strong> <span id="failedTests" style="color:#ef4444;">0</span></p>
            <p><strong>Success Rate:</strong> <span id="successRate">0%</span></p>
        </div>
        
        <div class="console-output" id="console"></div>
    </div>

    <script>
        // Copy the pronunciation mapping from script.js
        const SPOKEN_NUMBER_MAP = {
            '영': '0', '공': '0', '제로': '0',
            '일': '1', '하나': '1',
            '이': '2', '둘': '2',
            '삼': '3', '셋': '3',
            '사': '4', '넷': '4',
            '오': '5', '다섯': '5',
            '육': '6', '륙': '6', '여섯': '6',
            '칠': '7', '일곱': '7',
            '팔': '8', '여덟': '8',
            '구': '9', '아홉': '9',
            '십': '10'
        };

        // Simplified normalization function for testing
        function normalizeSpokenPlate(transcript) {
            if (!transcript) return '';
            
            logToConsole('Input: ' + transcript);
            
            const words = transcript.trim().toLowerCase().split(/\s+/);
            
            let processed = words.map(word => {
                if (SPOKEN_NUMBER_MAP[word]) {
                    return SPOKEN_NUMBER_MAP[word];
                }
                if (/^[가-힣]{1,2}$/.test(word)) {
                    return word;
                }
                if (word.includes('십')) {
                    const numMatch = word.match(/십([일이삼사오육칠팔구]?)/);
                    if (numMatch) {
                        const base = 10;
                        const suffix = numMatch[1];
                        if (suffix && SPOKEN_NUMBER_MAP[suffix]) {
                            return String(base + parseInt(SPOKEN_NUMBER_MAP[suffix]));
                        }
                        return String(base);
                    }
                }
                return word;
            }).join('');
            
            logToConsole('Processed: ' + processed);
            return processed;
        }

        // Test cases
        const testCases = [
            { input: '영 구 루 삼 삼 육 삼', expected: '09루3363', description: 'Number-first (영)' },
            { input: '공 구 루 삼 삼 육 삼', expected: '09루3363', description: 'Number-first (공)' },
            { input: '일 이 가 삼 사 오 육', expected: '12가3456', description: 'Number-first' },
            { input: '서 울 일 이 가 삼 사 오 육', expected: '서울12가3456', description: 'Text-first' },
            { input: '경 기 삼 사 나 오 육 칠 팔', expected: '경기34나5678', description: 'Text-first' },
            { input: '부 산 남 가 일 이 삼 사', expected: '부산남가1234', description: 'Motorbike' },
            { input: '칠 공 가 일 이 삼 사', expected: '70가1234', description: 'Business plate' },
            { input: '팔 구 나 오 육 칠 팔', expected: '89나5678', description: 'Business plate' },
            { input: '십 이 가 삼 사 오 육', expected: '12가3456', description: 'Multi-digit (십이)' },
            { input: '하나 둘 가 셋 넷 다섯 여섯', expected: '12가3456', description: 'Native Korean' },
            { input: '제로 구 루 삼 삼 육 삼', expected: '09루3363', description: 'Alternative (제로)' },
            { input: '륙 칠 가 팔 구 일 이', expected: '67가8912', description: 'Alternative (륙)' }
        ];

        function logToConsole(message) {
            const consoleDiv = document.getElementById('console');
            const div = document.createElement('div');
            div.textContent = '> ' + message;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        function runAllTests() {
            clearConsole();
            logToConsole('=== Starting Tests ===');
            
            let passed = 0;
            let failed = 0;
            
            testCases.forEach((testCase, index) => {
                logToConsole('');
                logToConsole(`Test ${index + 1}: ${testCase.description}`);
                
                const result = normalizeSpokenPlate(testCase.input);
                const success = result === testCase.expected;
                
                if (success) {
                    passed++;
                    logToConsole(`✅ PASS: ${result}`);
                } else {
                    failed++;
                    logToConsole(`❌ FAIL: Expected "${testCase.expected}", got "${result}"`);
                }
            });
            
            logToConsole('');
            logToConsole('=== Test Summary ===');
            logToConsole(`Total: ${testCases.length}`);
            logToConsole(`Passed: ${passed}`);
            logToConsole(`Failed: ${failed}`);
            logToConsole(`Success Rate: ${Math.round((passed / testCases.length) * 100)}%`);
            
            // Update stats
            document.getElementById('stats').style.display = 'block';
            document.getElementById('totalTests').textContent = testCases.length;
            document.getElementById('passedTests').textContent = passed;
            document.getElementById('failedTests').textContent = failed;
            document.getElementById('successRate').textContent = Math.round((passed / testCases.length) * 100) + '%';
        }

        // Render test cases
        function renderTestCases() {
            const container = document.getElementById('testCases');
            testCases.forEach((testCase, index) => {
                const div = document.createElement('div');
                div.className = 'test-case';
                div.innerHTML = `
                    <div class="test-input">Test ${index + 1}: ${testCase.description}</div>
                    <div class="test-expected">Input: "${testCase.input}"</div>
                    <div class="test-expected">Expected: "${testCase.expected}"</div>
                    <div class="test-result" id="result-${index}"></div>
                `;
                container.appendChild(div);
            });
        }

        // Initialize
        renderTestCases();
        logToConsole('Ready to test. Click "Run All Tests" to begin.');
    </script>
</body>
</html>
