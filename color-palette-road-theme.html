<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFE DRIVE - 도로 테마 색상 팔레트</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #2d2d2d;
            padding: 40px 20px;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 10px; color: #fff; font-size: 32px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 30px; }
        .palette-card { background: #1a1a1a; border-radius: 16px; overflow: hidden; border: 1px solid #333; }
        .palette-header { padding: 30px; color: white; text-align: center; position: relative; overflow: hidden; }
        .palette-header h2 { font-size: 22px; margin-bottom: 8px; position: relative; z-index: 2; }
        .palette-header p { opacity: 0.9; font-size: 13px; position: relative; z-index: 2; }
        .color-swatches { display: flex; height: 50px; }
        .swatch { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
        .palette-body { padding: 25px; background: #222; }
        .sample-button { display: block; width: 100%; padding: 16px; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 20px; transition: transform 0.2s; }
        .sample-button:hover { transform: scale(1.02); }
        .design-elements { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .design-el { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .sample-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { padding: 15px; border-radius: 8px; text-align: center; }
        .stat-box .value { font-size: 24px; font-weight: 900; }
        .stat-box .label { font-size: 11px; opacity: 0.8; margin-top: 4px; }
        .css-code { background: #111; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 11px; color: #0f0; overflow-x: auto; white-space: pre-wrap; }
        .road-pattern { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0.3; }
    </style>
</head>
<body>
<div class="container">
    <h1>🛣️ SAFE DRIVE 도로 테마 색상</h1>
    <p class="subtitle">아스팔트, 차선, 도로 표지판에서 영감을 받은 색상 조합</p>
    <div class="palette-grid" id="grid"></div>
</div>
</body>
</html>

<script>
function createRoadPattern(type, color) {
    if (type === 'dashed') {
        return `<svg width="100%" height="100%" style="position:absolute;top:0;left:0;">
            <defs><pattern id="dash-${color.replace('#','')}" patternUnits="userSpaceOnUse" width="40" height="100%">
                <rect x="18" y="0" width="4" height="20" fill="${color}" opacity="0.4"/>
                <rect x="18" y="30" width="4" height="20" fill="${color}" opacity="0.4"/>
                <rect x="18" y="60" width="4" height="20" fill="${color}" opacity="0.4"/>
                <rect x="18" y="90" width="4" height="20" fill="${color}" opacity="0.4"/>
            </pattern></defs>
            <rect width="100%" height="100%" fill="url(#dash-${color.replace('#','')})"/>
        </svg>`;
    } else if (type === 'double') {
        return `<svg width="100%" height="100%" style="position:absolute;top:0;left:0;">
            <line x1="45%" y1="0" x2="45%" y2="100%" stroke="${color}" stroke-width="3" opacity="0.5"/>
            <line x1="55%" y1="0" x2="55%" y2="100%" stroke="${color}" stroke-width="3" opacity="0.5"/>
        </svg>`;
    } else if (type === 'striped') {
        return `<svg width="100%" height="100%" style="position:absolute;top:0;left:0;">
            <defs><pattern id="stripe-${color.replace('#','')}" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
                <rect width="10" height="20" fill="${color}" opacity="0.3"/>
            </pattern></defs>
            <rect width="100%" height="100%" fill="url(#stripe-${color.replace('#','')})"/>
        </svg>`;
    }
    return `<svg width="100%" height="100%" style="position:absolute;top:0;left:0;">
        <line x1="50%" y1="0" x2="50%" y2="100%" stroke="${color}" stroke-width="4" opacity="0.5"/>
    </svg>`;
}

const grid = document.getElementById('grid');
roadPalettes.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'palette-card';
    const textColor = ['노란 중앙선', '아스팔트 & 옐로우'].includes(p.name) ? '#2D2D2D' : '#FFFFFF';
    card.innerHTML = `
        <div class="palette-header" style="background: ${p.gradient}; min-height: 140px;">
            ${createRoadPattern(p.pattern, p.patternColor)}
            <h2 style="color: ${textColor}">${p.name}</h2>
            <p style="color: ${textColor}">${p.description}</p>
        </div>
        <div class="color-swatches">
            <div class="swatch" style="background: ${p.dark}; color: #fff;">${p.dark}</div>
            <div class="swatch" style="background: ${p.primary}; color: #fff;">${p.primary}</div>
            <div class="swatch" style="background: ${p.secondary}; color: ${p.name.includes('노란') ? '#333' : '#fff'};">${p.secondary}</div>
            <div class="swatch" style="background: ${p.accent}; color: ${p.accent === '#FFFFFF' ? '#333' : '#fff'};">${p.accent}</div>
            <div class="swatch" style="background: ${p.light}; color: #333;">${p.light}</div>
        </div>
        <div class="palette-body">
            <button class="sample-button" style="background: ${p.gradient}; color: ${textColor};">🚗 차량 검색하기</button>
            <div class="design-elements">
                ${p.elements.map(el => `<span class="design-el" style="background: ${p.light}; color: ${p.dark};">${el}</span>`).join('')}
            </div>
            <div class="sample-stats">
                <div class="stat-box" style="background: ${p.primary}; color: ${textColor};">
                    <div class="value">12,345</div>
                    <div class="label">총 조회수</div>
                </div>
                <div class="stat-box" style="background: ${p.secondary}; color: ${textColor};">
                    <div class="value">567</div>
                    <div class="label">오늘 등록</div>
                </div>
            </div>
            <div class="css-code">/* ${p.name} */
--primary: ${p.primary};
--secondary: ${p.secondary};
--gradient: ${p.gradient};
--accent: ${p.accent};

/* 교체: #667eea → ${p.primary} */
/* 교체: #764ba2 → ${p.secondary} */</div>
        </div>
    `;
    grid.appendChild(card);
});
</script>
