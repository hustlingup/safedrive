<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SafeDrive - Referral Stats (Admin)</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <style>
        @font-face {
            font-family: 'GmarketSans';
            font-weight: 500;
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'GmarketSans', -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #f0f6fc;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #30363d;
            border-color: #3b82f6;
        }
        
        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        /* 로딩 */
        #statsLoader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 0;
        }
        
        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #30363d;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 접근 거부 */
        .access-denied {
            text-align: center;
            padding: 100px 20px;
        }
        
        .denied-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .access-denied h2 {
            color: #ef4444;
            margin-bottom: 10px;
        }
        
        /* 요약 */
        #statsSummary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .summary-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .summary-value {
            font-size: 32px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 4px;
        }
        
        .summary-label {
            font-size: 13px;
            color: #8b949e;
        }
        
        /* 테이블 */
        .table-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #21262d;
        }
        
        th {
            background: #21262d;
            font-size: 12px;
            text-transform: uppercase;
            color: #8b949e;
            font-weight: 600;
        }
        
        tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .winner-row {
            background: rgba(34, 197, 94, 0.1);
        }
        
        .winner-row:hover {
            background: rgba(34, 197, 94, 0.15);
        }
        
        .rank-cell {
            font-size: 18px;
            width: 60px;
        }
        
        .id-cell {
            font-family: monospace;
            font-size: 13px;
        }
        
        .count-cell {
            font-weight: 700;
            color: #f0f6fc;
        }
        
        .status-cell {
            display: flex;
            gap: 8px;
        }
        
        .winner-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .top3-badge {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            color: #8b949e;
            padding: 40px !important;
        }
        
        /* 에러 */
        #statsError {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Referral Stats (Admin)</h1>
            <div class="header-actions">
                <button id="refreshStatsBtn" class="btn">🔄 새로고침</button>
                <button id="exportCsvBtn" class="btn btn-primary">📥 CSV 다운로드</button>
            </div>
        </div>
        
        <div id="statsContainer">
            <!-- 로딩 -->
            <div id="statsLoader">
                <div class="loader-spinner"></div>
            </div>
            
            <!-- 에러 -->
            <div id="statsError" style="display: none;"></div>
            
            <!-- 콘텐츠 -->
            <div id="statsContent" style="display: none;">
                <!-- 요약 -->
                <div id="statsSummary"></div>
                
                <!-- 테이블 -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>순위</th>
                                <th>추천인 ID</th>
                                <th>횟수</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="/js/referral-core.js"></script>
    <script src="/js/referral-stats.js"></script>
</body>
</html>
