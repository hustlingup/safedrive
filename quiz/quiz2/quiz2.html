                        }
                        
                        // Show offline indicator if needed
                        const offlineIndicator = document.getElementById('offlineIndicator');
                        if (offlineIndicator) {
                            offlineIndicator.classList.toggle('visible', stats.isOffline);
                        }
                    });
                    
                    // Get most popular result
                    QuizCounter.getMostPopular('quiz2').then(function(popular) {
                        const popularResultEl = document.getElementById('popularResult');
                        if (popularResultEl && popular) {
                            // Map result type codes to display names for Quiz2
                            const resultNames = {
                                'A': '냉철한 전략가',
                                'B': '본능적 생존자',
                                'C': '침착한 수호자',
                                'D': '과감한 돌파자',
                                'AB': '균형잡힌 대응자',
                                'BC': '직관적 보호자',
                                'AC': '분석적 방어자',
                                'DA': '적극적 해결사'
                            };
                            const typeName = resultNames[popular.type] || popular.type;
                            popularResultEl.textContent = `🏆 ${typeName} 유형이 가장 많아요!`;
                        }
                    });
                });
            }
            
            // Share functionality
            const shareBtn = document.getElementById('shareBtn');
            if (shareBtn) {
                shareBtn.addEventListener('click', function() {
                    const shareData = {
                        title: '극한의 시나리오 챌린지 - SAFE DRIVE',
                        text: '도로 위 극한 상황, 넌 살아남을 수 있어? 도전해봐!',
                        url: window.location.href
                    };
                    
                    if (navigator.share) {
                        navigator.share(shareData).catch(function(err) {
                            console.log('Share cancelled or failed:', err);
                        });
                    } else {
                        // Fallback: copy to clipboard
                        navigator.clipboard.writeText(window.location.href).then(function() {
                            alert('도전장 URL이 복사되었습니다!');
                        }).catch(function() {
                            alert('URL: ' + window.location.href);
                        });
                    }
                });
            }
            
            // Initialize cookie consent
            if (typeof CookieConsent !== 'undefined') {
                CookieConsent.init();
            }
            
            // Keyboard accessibility: Enable Space key activation for links with role="button"
            document.querySelectorAll('a[role="button"]').forEach(function(link) {
                link.addEventListener('keydown', function(e) {
                    if (e.key === ' ' || e.key === 'Spacebar') {
                        e.preventDefault();
                        link.click();
                    }
                });
            });
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (typeof QuizAnimations !== 'undefined') {
                QuizAnimations.destroy();
            }
            if (typeof QuizCounter !== 'undefined') {
                QuizCounter.destroy();
            }
        });
    </script>
    
    <!-- Visually hidden class for screen readers -->
    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
