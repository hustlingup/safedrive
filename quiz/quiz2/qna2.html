    <!-- Page initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize mobile menu toggle
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (navToggle && navMenu) {
                navToggle.addEventListener('click', function() {
                    const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
                    navToggle.setAttribute('aria-expanded', !isExpanded);
                    navMenu.classList.toggle('active');
                    navToggle.setAttribute('aria-label', isExpanded ? '메뉴 열기' : '메뉴 닫기');
                });
            }
            
            // Initialize cookie consent
            if (typeof CookieConsent !== 'undefined') {
                CookieConsent.init();
            }
            
            // DOM Elements
            const loadingState = document.getElementById('loadingState');
            const quizContent = document.getElementById('quizContent');
            const errorState = document.getElementById('errorState');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const currentQuestionEl = document.getElementById('currentQuestion');
            const totalQuestionsEl = document.getElementById('totalQuestions');
            const questionText = document.getElementById('questionText');
            const optionsContainer = document.getElementById('optionsContainer');
            const backBtn = document.getElementById('backBtn');
            const restartBtn = document.getElementById('restartBtn');
            
            // Quiz data
            let quizData = null;
            let selectedOption = null;
            
            /**
             * Load quiz data from JSON file
             */
            async function loadQuizData() {
                try {
                    const response = await fetch('quiz2.json');
                    if (!response.ok) {
                        throw new Error('Failed to load quiz data');
                    }
                    quizData = await response.json();
                    return quizData;
                } catch (error) {
                    console.error('Error loading quiz data:', error);
                    throw error;
                }
            }
            
            /**
             * Initialize the quiz engine
             */
            function initQuizEngine() {
                if (!quizData || !quizData.questions) {
                    throw new Error('Quiz data not loaded');
                }
                
                QuizEngine.init({
                    quizId: 'quiz2',
                    questions: quizData.questions,
                    calculateResult: calculateQuiz2Result,
                    resultPageUrl: 'result2.html',
                    resumeFromStorage: true
                });
            }
            
            /**
             * Render the current question
             */
            function renderQuestion() {
                const question = QuizEngine.getCurrentQuestion();
                const progress = QuizEngine.getProgress();
                const state = QuizEngine.getState();
                
                if (!question) {
                    // Quiz is complete, redirect to result page
                    const resultUrl = QuizEngine.getResultUrl();
                    if (resultUrl) {
                        window.location.href = resultUrl;
                    }
                    return;
                }
                
                // Update progress bar
                const percentage = (progress.current - 1) / progress.total * 100;
                progressFill.style.width = percentage + '%';
                progressBar.setAttribute('aria-valuenow', Math.round(percentage));
                currentQuestionEl.textContent = progress.current;
                totalQuestionsEl.textContent = progress.total;
                
                // Update question text
                questionText.textContent = question.q;
                
                // Clear and render options
                optionsContainer.innerHTML = '';
                selectedOption = null;
                
                // Check if there's a previously selected answer for this question
                const previousAnswer = state.answers[state.currentIndex];
                
                question.options.forEach(function(option, index) {
                    const optionEl = document.createElement('button');
                    optionEl.type = 'button';
                    optionEl.className = 'quiz-flow-option';
                    optionEl.setAttribute('role', 'radio');
                    optionEl.setAttribute('aria-checked', 'false');
                    optionEl.setAttribute('data-value', option.val);
                    optionEl.setAttribute('tabindex', '0');
                    
                    // Check if this was the previously selected answer
                    if (previousAnswer && option.val === previousAnswer) {
                        optionEl.classList.add('selected');
                        optionEl.setAttribute('aria-checked', 'true');
                        selectedOption = optionEl;
                    }
                    
                    optionEl.innerHTML = `
                        <span class="quiz-flow-option-indicator" aria-hidden="true"></span>
                        <span class="quiz-flow-option-text">${option.text}</span>
                    `;
                    
                    // Click handler
                    optionEl.addEventListener('click', function() {
                        handleOptionSelect(optionEl, option.val);
                    });
                    
                    // Keyboard handler
                    optionEl.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleOptionSelect(optionEl, option.val);
                        }
                    });
                    
                    optionsContainer.appendChild(optionEl);
                });
                
                // Update back button state
                backBtn.disabled = progress.current <= 1;
            }
            
            /**
             * Handle option selection
             */
            function handleOptionSelect(optionEl, value) {
                // Remove selection from all options
                const allOptions = optionsContainer.querySelectorAll('.quiz-flow-option');
                allOptions.forEach(function(opt) {
                    opt.classList.remove('selected');
                    opt.setAttribute('aria-checked', 'false');
                });
                
                // Select the clicked option
                optionEl.classList.add('selected');
                optionEl.setAttribute('aria-checked', 'true');
                selectedOption = optionEl;
                
                // Submit answer after a short delay for visual feedback
                setTimeout(function() {
                    const isComplete = QuizEngine.submitAnswer(value);
                    
                    if (isComplete) {
                        // Quiz complete, redirect to result page
                        const resultUrl = QuizEngine.getResultUrl();
                        if (resultUrl) {
                            window.location.href = resultUrl;
                        }
                    } else {
                        // Render next question
                        renderQuestion();
                    }
                }, 300);
            }
            
            /**
             * Handle back button click
             */
            function handleBack() {
                if (QuizEngine.goBack()) {
                    renderQuestion();
                }
            }
            
            /**
             * Handle restart button click
             */
            function handleRestart() {
                if (confirm('처음부터 다시 시작하시겠습니까?')) {
                    QuizEngine.restart();
                    renderQuestion();
                }
            }
            
            /**
             * Show error state
             */
            function showError() {
                loadingState.style.display = 'none';
                quizContent.style.display = 'none';
                errorState.style.display = 'block';
            }
            
            /**
             * Show quiz content
             */
            function showQuizContent() {
                loadingState.style.display = 'none';
                errorState.style.display = 'none';
                quizContent.style.display = 'block';
            }
            
            // Event listeners
            backBtn.addEventListener('click', handleBack);
            restartBtn.addEventListener('click', handleRestart);
            
            // Keyboard accessibility: Enable Space key activation for links with role="button"
            document.querySelectorAll('a[role="button"], a.quiz-flow-btn').forEach(function(link) {
                link.addEventListener('keydown', function(e) {
                    if (e.key === ' ' || e.key === 'Spacebar') {
                        e.preventDefault();
                        link.click();
                    }
                });
            });
            
            // Initialize quiz
            loadQuizData()
                .then(function() {
                    initQuizEngine();
                    showQuizContent();
                    renderQuestion();
                })
                .catch(function(error) {
                    console.error('Failed to initialize quiz:', error);
                    showError();
                });
        });
    </script>
</body>
</html>
