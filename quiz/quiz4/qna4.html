    <style>
        .quiz-flow-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1A1A1A 0%, #37474F 100%);
            display: flex;
            flex-direction: column;
        }

        .quiz-flow-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 100px 20px 40px;
        }

        .quiz-flow-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 32px;
        }

        .quiz-flow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quiz-flow-badge {
            background: #ffd700;
            color: #1f2937;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .quiz-flow-progress-count {
            font-family: 'GmarketSans', sans-serif;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .quiz-flow-progress-count .current {
            font-weight: 700;
            color: #ffd700;
        }

        .quiz-flow-progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .quiz-flow-progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #ffd700 0%, #ffca28 100%);
            border-radius: 9999px;
            transition: width 0.4s ease;
        }

        .quiz-flow-question-text {
            font-family: 'GmarketSans', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 28px;
        }

        .quiz-flow-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .quiz-flow-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quiz-flow-option:hover {
            border-color: #ffd700;
            background-color: rgba(255, 215, 0, 0.05);
            transform: translateY(-2px);
        }

        .quiz-flow-option.selected {
            border-color: #ffd700;
            background-color: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
        }

        .quiz-flow-option-indicator {
            width: 24px;
            height: 24px;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-flow-option.selected .quiz-flow-option-indicator {
            border-color: #ffd700;
            background-color: #ffd700;
        }

        .quiz-flow-option.selected .quiz-flow-option-indicator::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .quiz-flow-option-text {
            font-family: 'GmarketSans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #374151;
            line-height: 1.5;
            flex: 1;
        }

        .quiz-flow-nav {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .quiz-flow-btn {
            font-family: 'GmarketSans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .quiz-flow-btn-back {
            background-color: #f3f4f6;
            color: #6b7280;
        }

        .quiz-flow-btn-back:hover:not(:disabled) {
            background-color: #e5e7eb;
            color: #374151;
        }

        .quiz-flow-btn-back:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quiz-flow-btn-restart {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #e5e7eb;
        }

        .quiz-flow-btn-restart:hover {
            background-color: #fef2f2;
            color: #ef4444;
        }

        .quiz-flow-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .quiz-flow-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .quiz-flow-loading-text {
            font-family: 'GmarketSans', sans-serif;
            color: #6b7280;
            margin-top: 16px;
        }

        .quiz-flow-error {
            text-align: center;
            padding: 40px 20px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 768px) {
            .quiz-flow-content {
                padding: 80px 16px 30px;

            .quiz-flow-container {
                padding: 24px;

                font-size: 1.125rem;
            }
        }

        @media (max-width: 480px) {

                padding: 70px 12px 20px;
            }

            .quiz-flow-container {

            }

            .quiz-flow-question-text {

            }

            .quiz-flow-option {
                padding: 14px;
                gap: 12px;
            }

            .quiz-flow-option-text {
                font-size: 0.875rem;
            }
        }

    <script>
        (function () {
            'use strict';

            let quizData = null;
            let currentIndex = 0;
            let answers = [];

            const loadingState = document.getElementById('loadingState');
            const quizContent = document.getElementById('quizContent');
            const errorState = document.getElementById('errorState');
            const progressFill = document.getElementById('progressFill');
            const currentQuestionEl = document.getElementById('currentQuestion');
            const totalQuestionsEl = document.getElementById('totalQuestions');
            const questionText = document.getElementById('questionText');
            const optionsContainer = document.getElementById('optionsContainer');
            const backBtn = document.getElementById('backBtn');
            const restartBtn = document.getElementById('restartBtn');

            function setupNavToggle() {
                const navToggle = document.getElementById('navToggle');
                const navMenu = document.getElementById('navMenu');

                if (navToggle && navMenu) {
                    navToggle.addEventListener('click', function () {
                        const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
                        navToggle.setAttribute('aria-expanded', !isExpanded);
                        navMenu.classList.toggle('active');
                    });
                }
            }

            async function loadQuizData() {
                try {
                    const response = await fetch('quiz4.json');
                    if (!response.ok) throw new Error('Failed to load');
                    quizData = await response.json();

                    // Shuffle options for random order
                    if (quizData.questions) {
                        quizData.questions.forEach(function (q) {
                            if (q.options) {
                                q.options.sort(function () { return 0.5 - Math.random(); });
                            }
                        });
                    }

                    return true;
                } catch (e) {
                    console.error('Error loading quiz:', e);
                    return false;
                }
            }

            function renderQuestion() {
                if (currentIndex >= quizData.questions.length) {
                    let score = 0;
                    const answerDetails = [];

                    quizData.questions.forEach((q, i) => {
                        const userChoiceIndex = answers[i];
                        const userChoiceOption = q.options[userChoiceIndex];
                        const isCorrect = userChoiceOption && userChoiceOption.isCorrect === true;

                        if (isCorrect) score++;

                        answerDetails.push({
                            questionIndex: i,
                            selectedIndex: userChoiceIndex,
                            selectedText: userChoiceOption ? userChoiceOption.text : '선택 안함',
                            isCorrect: isCorrect
                        });
                    });

                    const resultData = {
                        score: score,
                        total: quizData.questions.length,
                        answers: answerDetails
                    };

                    sessionStorage.setItem('quiz4Result', JSON.stringify(resultData));
                    window.location.href = 'result4.html';
                    return;
                }

                const question = quizData.questions[currentIndex];
                const total = quizData.questions.length;

                const percentage = (currentIndex / total) * 100;
                progressFill.style.width = percentage + '%';
                currentQuestionEl.textContent = currentIndex + 1;
                totalQuestionsEl.textContent = total;

                questionText.textContent = question.q;

                optionsContainer.innerHTML = '';
                question.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'quiz-flow-option';
                    btn.setAttribute('role', 'radio');
                    btn.setAttribute('aria-checked', answers[currentIndex] === index ? 'true' : 'false');
                    if (answers[currentIndex] === index) {
                        btn.classList.add('selected');
                    }
                    btn.innerHTML = `
                    <span class="quiz-flow-option-indicator"></span>
                    <span class="quiz-flow-option-text">${option.text}</span>
                `;
                    btn.addEventListener('click', () => selectOption(index));
                    optionsContainer.appendChild(btn);
                });

                backBtn.disabled = currentIndex === 0;
            }

            function selectOption(index) {
                const options = optionsContainer.querySelectorAll('.quiz-flow-option');
                options.forEach((opt) => {
                    opt.classList.remove('selected');
                    opt.setAttribute('aria-checked', 'false');
                });
                options[index].classList.add('selected');
                options[index].setAttribute('aria-checked', 'true');

                answers[currentIndex] = index;

                setTimeout(() => {
                    currentIndex++;
                    renderQuestion();
                }, 300);
            }

            function goBack() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                }
            }

            function restart() {
                if (confirm('처음부터 다시 시작하시겠습니까?')) {
                    currentIndex = 0;
                    answers = [];
                    renderQuestion();
                }
            }

            async function init() {
                setupNavToggle();

                const loaded = await loadQuizData();

                if (!loaded || !quizData || !quizData.questions) {
                    loadingState.style.display = 'none';
                    errorState.style.display = 'block';
                    return;
                }

                backBtn.addEventListener('click', goBack);
                restartBtn.addEventListener('click', restart);

                loadingState.style.display = 'none';
                quizContent.style.display = 'block';
                renderQuestion();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
