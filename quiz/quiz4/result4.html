    <script>
        (function () {
            'use strict';

            const RESULTS = {
                S: { 
                    title: '⚖️ 교통사고 전문 변호사급', 
                    desc: '완벽합니다! 블랙박스 사각지대까지 계산하고, 과실 비율까지 예측하는 수준이네요. 주변 지인들이 사고 나면 가장 먼저 당신에게 전화를 걸겠어요.',
                    img: '/assets/img/quiz4_img/lawyer.webp'
                },
                A: { 
                    title: '🚘 똑소리 나는 베테랑', 
                    desc: '훌륭합니다! 사고가 나도 당황하지 않고 증거 확보부터 보험 처리까지 깔끔하게 해결할 수 있는 능력을 갖추셨군요.',
                    img: '/assets/img/quiz4_img/veteran.webp'
                },
                B: { 
                    title: '😅 약간 불안한 초보 운전자', 
                    desc: '보험사를 부르는 건 알지만, 디테일한 대처가 부족합니다. 사설 렉카나 애매한 합의 요구에 휘말릴 수 있으니 조금 더 강단 있는 대처가 필요해요.',
                    img: '/assets/img/quiz4_img/rookie.webp'
                },
                C: { 
                    title: '😱 도로 위 호구 확정', 
                    desc: '큰일이네요! 사고가 나면 당황해서 손해를 보거나, 억울하게 독박을 쓸 확률이 높습니다. \'사고 처리 매뉴얼\'을 꼭 숙지하고 운전하세요!',
                    img: '/assets/img/quiz4_img/hogu.webp'
                }
            };

            function getGrade(score) {
                if (score >= 14) return 'S';
                if (score >= 11) return 'A';
                if (score >= 6) return 'B';
                return 'C';
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text || '';
                return div.innerHTML;
            }

            function setupNavToggle() {
                const navToggle = document.getElementById('navToggle');
                const navMenu = document.getElementById('navMenu');

                if (navToggle && navMenu) {
                    navToggle.addEventListener('click', function () {
                        const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
                        navToggle.setAttribute('aria-expanded', !isExpanded);
                        navMenu.classList.toggle('active');
                    });
                }
            }

            function setupShare(score, resultInfo) {
                const shareUrl = window.location.origin + '/quiz/quiz4/quiz4.html';
                const shareTitle = `나의 사고 대처 점수: ${score}/15 - ${resultInfo.title}`;
                const shareText = `교통사고 대처 능력 테스트에서 ${score}/15점을 받았어요! 당신도 도전해보세요!`;

                const shareNativeBtn = document.getElementById('shareNativeBtn');
                const copyLinkBtn = document.getElementById('copyLinkBtn');
                const copySuccess = document.getElementById('copySuccess');

                if (navigator.share) {
                    shareNativeBtn.style.display = 'inline-flex';
                    shareNativeBtn.addEventListener('click', async () => {
                        try {
                            await navigator.share({ title: shareTitle, text: shareText, url: shareUrl });
                        } catch (e) {
                            if (e.name !== 'AbortError') console.error('Share failed:', e);
                        }
                    });
                } else {
                    shareNativeBtn.style.display = 'none';
                }

                copyLinkBtn.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(shareUrl);
                        copySuccess.style.display = 'block';
                        setTimeout(() => { copySuccess.style.display = 'none'; }, 3000);
                    } catch (e) {
                        const textArea = document.createElement('textarea');
                        textArea.value = shareUrl;
                        textArea.style.position = 'fixed';
                        textArea.style.opacity = '0';
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        copySuccess.style.display = 'block';
                        setTimeout(() => { copySuccess.style.display = 'none'; }, 3000);
                    }
                });
            }

            async function init() {
                setupNavToggle();

                const loadingState = document.getElementById('loadingState');
                const resultContent = document.getElementById('resultContent');
                const errorState = document.getElementById('errorState');

                try {
                    const resultStr = sessionStorage.getItem('quiz4Result');

                    if (!resultStr) {
                        throw new Error('No result found');
                    }

                    const result = JSON.parse(resultStr);

                    if (typeof result.score !== 'number') {
                        throw new Error('Invalid score');
                    }

                    const grade = getGrade(result.score);
                    const resultInfo = RESULTS[grade];

                    document.getElementById('scoreValue').textContent = result.score;
                    document.getElementById('resultTitle').textContent = resultInfo.title;
                    document.getElementById('resultDescription').textContent = resultInfo.desc;

                    const resultImage = document.getElementById('resultImage');
                    if (resultInfo.img && resultImage) {
                        resultImage.src = resultInfo.img;
                        resultImage.style.display = 'block';
                    }

                    setupShare(result.score, resultInfo);

                    let questions = [];
                    try {
                        const response = await fetch('quiz4.json');
                        if (response.ok) {
                            const data = await response.json();
                            questions = data.questions || [];
                        }
                    } catch (e) {
                        console.error('Error loading questions:', e);
                    }

                    const reviewList = document.getElementById('reviewList');
                    if (result.answers && questions.length > 0) {
                        reviewList.innerHTML = result.answers.map((answer, index) => {
                            const question = questions[index];
                            if (!question) return '';

                            const correctOption = question.options.find(opt => opt.isCorrect === true);
                            const correctText = correctOption ? correctOption.text : '';
                            const explanation = correctOption ? correctOption.desc : '';

                            return `
                            <div class="review-item">
                                <div class="review-question">Q${index + 1}. ${escapeHtml(question.q)}</div>
                                <div class="review-answer ${answer.isCorrect ? 'correct' : 'incorrect'}">
                                    <i class="fas ${answer.isCorrect ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                                    <span>${answer.isCorrect ? '정답' : '오답'}: ${escapeHtml(answer.selectedText)}</span>
                                </div>
                                ${!answer.isCorrect ? `<div class="review-correct-answer">정답: ${escapeHtml(correctText)}</div>` : ''}
                                ${explanation ? `<div class="review-explanation">💡 ${escapeHtml(explanation)}</div>` : ''}
                            </div>
                        `;
                        }).join('');
                    }

                    loadingState.style.display = 'none';
                    resultContent.style.display = 'block';

                } catch (e) {
                    console.error('Error:', e);
                    loadingState.style.display = 'none';
                    errorState.style.display = 'block';
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
